stages:
  - test
  - deploy

# ============================
# ETAPA 1 - TESTES
# ============================

test:
  stage: test
  image: maven:3.9-eclipse-temurin-21

  script:
    - mvn -B clean verify

  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == "main"'


# ============================
# ETAPA 2 - BUILD E DEPLOY
# ============================

deploy:
  stage: deploy

  image: gcr.io/google.com/cloudsdktool/google-cloud-cli:stable

  id_tokens:
    GITLAB_OIDC_TOKEN:
      aud: https://gitlab.com

  variables:
    GOOGLE_APPLICATION_CREDENTIALS: "$CI_PROJECT_DIR/gcp-credentials.json"

  before_script:
    - |
      set -eu

      echo "Preparando autenticação OIDC..."

      printf '%s' "$GITLAB_OIDC_TOKEN" > oidc-token.jwt
      chmod 600 oidc-token.jwt

      gcloud iam workload-identity-pools create-cred-config \
        "projects/${GCP_PROJECT_NUMBER}/locations/global/workloadIdentityPools/${GCP_WIF_POOL}/providers/${GCP_WIF_PROVIDER}" \
        --service-account="$GCP_DEPLOY_SA" \
        --credential-source-file="$CI_PROJECT_DIR/oidc-token.jwt" \
        --output-file="$GOOGLE_APPLICATION_CREDENTIALS"

      gcloud auth login \
        --cred-file="$GOOGLE_APPLICATION_CREDENTIALS" \
        --quiet

      gcloud config set project "$GCP_PROJECT_ID"

      echo "Autenticação configurada."

  script:
    - |
      set -eu

      IMAGE_URL="${GCP_REGION}-docker.pkg.dev/${GCP_PROJECT_ID}/meufinanceiro-api/api:${CI_COMMIT_SHA}"

      echo "Construindo imagem Docker..."

      gcloud builds submit . \
        --tag="$IMAGE_URL" \
        --region="$GCP_REGION" \
        --project="$GCP_PROJECT_ID" \
        --quiet

      echo "Atualizando Cloud Run..."

      gcloud run deploy meufinanceiro-api \
        --image="$IMAGE_URL" \
        --region="$GCP_REGION" \
        --project="$GCP_PROJECT_ID" \
        --quiet

      echo "Verificando status do serviço..."

      gcloud run services describe meufinanceiro-api \
        --region="$GCP_REGION" \
        --project="$GCP_PROJECT_ID" \
        --format="yaml(status.conditions,status.latestReadyRevisionName,status.url)"

  after_script:
    - rm -f oidc-token.jwt gcp-credentials.json

  environment:
    name: production-test

  resource_group: meufinanceiro-deploy

  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
